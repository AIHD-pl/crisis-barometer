name: Aktualizuj Barometr Ryzyka

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom barometr
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          mkdir -p monitor_data
          python crisis_monitor.py

      - name: Commit danych
        run: |
          git config user.name "Crisis Barometer"
          git config user.email "barometer@users.noreply.github.com"
          git add monitor_data/latest_report.json
          if git diff --staged --quiet; then
            echo "Brak zmian"
          else
            git commit -m "Auto update barometru $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
